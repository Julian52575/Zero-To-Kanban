# Overrides for the prod environment. Used by the Argo CD Application in
# deployment/argocd/environments/prod-app.yaml.
#
# NOTE: pin backend/frontend image tags to a release tag (not `latest`)
# before this is used against a real prod cluster.
#
# Every `existingSecret` below must be pre-created in ztk-prod before the
# first sync -- see "Shared / production cluster" in deployment/README.md.

backend:
  image:
    tag: latest
  replicaCount: 4
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

auth:
  image:
    tag: latest
  replicaCount: 2
  cookieSecure: "true"
  existingSecret: zero-to-kanban-prod-auth
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  image:
    tag: latest
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  entryPoints:
    - websecure
  # values.yaml default-enables /metrics for local/dev testing, where the
  # entrypoint isn't internet-reachable. Here it would be: the route is
  # behind BasicAuth, but it still discloses router topology/error rates to
  # anyone holding that one shared credential, so keep it off unless an
  # out-of-cluster scraper needs it (an in-cluster Prometheus scrapes
  # Traefik's :9100 metrics entrypoint directly, no route needed).
  metrics:
    enabled: false
  tls:
    enabled: true
    secretName: kanban-tls

postgresql:
  auth:
    existingSecret: zero-to-kanban-prod-postgresql
  # docker.io/bitnami/postgresql dropped all versioned tags in its Aug 2025
  # catalog restructuring and now only publishes a rolling `latest` -- the
  # chart's pinned default (17.6.0-debian-12-r4) 404s. Same image is still
  # available frozen under the bitnamilegacy mirror; pin that here (see the
  # same override in values-dev.yaml).
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
  primary:
    persistence:
      size: 10Gi

authdb:
  auth:
    existingSecret: zero-to-kanban-prod-authdb
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
  primary:
    persistence:
      size: 5Gi

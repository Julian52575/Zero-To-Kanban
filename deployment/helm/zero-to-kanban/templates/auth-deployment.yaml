apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zero-to-kanban.fullname" . }}-auth
  labels:
    {{- include "zero-to-kanban.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: auth
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: auth
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.containerPort }}
          # DATABASE_URL is assembled at start from the authdb Secret, same
          # pattern as the backend. Migrations run before the server starts.
          command:
            - sh
            - -c
            - export DATABASE_URL="postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)?schema=public" && npx prisma migrate deploy && node src/index.js
          env:
            - name: DB_USER
              value: {{ .Values.authdb.auth.username | quote }}
            - name: DB_NAME
              value: {{ .Values.authdb.auth.database | quote }}
            - name: DB_HOST
              value: {{ include "zero-to-kanban.authdb.host" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zero-to-kanban.authdb.secretName" . }}
                  key: {{ include "zero-to-kanban.authdb.secretKey" . }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zero-to-kanban.auth.secretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
            - name: COOKIE_SECURE
              value: {{ .Values.auth.cookieSecure | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}

{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zero-to-kanban.auth.secretName" . }}
  labels:
    {{- include "zero-to-kanban.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey }}: {{ required "auth.sessionSecret or auth.existingSecret must be set" .Values.auth.sessionSecret | quote }}
{{- end }}

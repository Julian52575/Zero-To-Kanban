{{- if not .Values.rabbitmq.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zero-to-kanban.rabbitmq.secretName" . }}
  labels:
    {{- include "zero-to-kanban.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
type: Opaque
stringData:
  {{ .Values.rabbitmq.existingSecretKey }}: {{ required "rabbitmq.password or rabbitmq.existingSecret must be set" .Values.rabbitmq.password | quote }}
{{- end }}

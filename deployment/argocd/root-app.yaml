# App-of-apps root: point Argo CD at this Application once, and it will
# discover/manage the per-environment child Applications in ./environments.
#
#   kubectl apply -n argocd -f deployment/argocd/root-app.yaml
#
# Update `spec.source.repoURL` to this repo's actual git remote before
# applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztk-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/julian52575/Zero-To-Kanban.git
    targetRevision: main
    path: deployment/argocd/environments
    directory:
      recurse: false
      # dev-k3s-app.yaml and monitoring-k3s-app.yaml are for standalone
      # local k3s use only (see their own comments) -- exclude them so a
      # shared/real root-app sync never spawns them pointed at the wrong
      # cluster.
      exclude: "{dev-k3s-app.yaml,monitoring-k3s-app.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

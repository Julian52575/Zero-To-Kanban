<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in &middot; Zero-To-Kaban</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0; min-height: 100vh; display: grid; place-items: center;
      }
      form {
        width: min(92vw, 22rem); display: grid; gap: 0.75rem;
        padding: 2rem; border: 1px solid #8884; border-radius: 0.75rem;
      }
      h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
      p.hint { margin: 0; font-size: 0.8125rem; opacity: 0.7; }
      label { display: grid; gap: 0.25rem; font-size: 0.875rem; }
      input {
        padding: 0.5rem 0.625rem; font: inherit;
        border: 1px solid #8886; border-radius: 0.375rem; background: transparent; color: inherit;
      }
      button {
        margin-top: 0.25rem; padding: 0.55rem; font: inherit; font-weight: 600;
        border: 0; border-radius: 0.375rem; cursor: pointer;
      }
      .error { color: #c0392b; font-size: 0.875rem; min-height: 1.25rem; }
    </style>
  </head>
  <body>
    <form id="form" novalidate>
      <h1>Sign in</h1>
      <p class="hint">
        Temporary sign-in: pick a username to continue. A new name is created,
        an existing one is reused. No password.
      </p>
      <label>Username
        <input
          type="text"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          pattern="[A-Za-z0-9_-]{3,32}"
          autofocus
          required
        />
      </label>
      <div class="error" id="error" role="alert"></div>
      <button type="submit">Continue</button>
    </form>

    <script>
      const params = new URLSearchParams(location.search);
      // Keep only same-site absolute paths (the server enforces this too).
      const raw = params.get("next") || "/";
      const next = /^\/(?!\/)/.test(raw) ? raw : "/";

      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("error");
        error.textContent = "";

        const form = event.currentTarget;
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: form.username.value, next }),
        });

        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          location.assign(data.next || next);
          return;
        }
        const data = await res.json().catch(() => ({}));
        error.textContent = data.error || "Sign in failed";
      });
    </script>
  </body>
</html>

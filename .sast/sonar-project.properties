# SonarQube Cloud analysis settings for Zero-To-Kaban.
#
# Loaded explicitly by .github/workflows/ci-sast.yml:
#   SonarSource/sonarqube-scan-action ... -Dproject.settings=.sast/sonar-project.properties
#
# Paths below are relative to sonar.projectBaseDir, which the action leaves at
# the repo root. Full parameter reference:
#   https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

# --- Project identity ------------------------------------------------------
# Both values come from the SonarQube Cloud project setup screen
# (https://sonarcloud.io/projects/create). Fill these in before the first run.
sonar.organization=julian52575
sonar.projectKey=Julian52575_Zero-To-Kanban
# Optional display name; defaults to the project key.
# sonar.projectName=Zero-To-Kaban

# --- What to analyse -----------------------------------------------------
# Monorepo: Express API under backend/, Vite + React app under frontend/.
# Frontend tests are colocated next to the components they cover (no
# separate spec/ dir like the backend), so frontend/src doubles as a test
# root too -- sonar.test.inclusions carves the *.test.tsx files back out as
# tests, and sonar.exclusions drops them from the main-source scan so they
# aren't double-counted.
sonar.sources=backend/src,frontend/src,frontend/src/components
sonar.tests=backend/spec,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Build output, minified vendor drops, and frontend test files (see above)
# -- not analysed as main source. frontend/src/App.jsx, main.jsx and
# frontend/components/TodoApp.jsx are the pre-TypeScript implementation,
# superseded by App.tsx/main.tsx/components/*.tsx but not yet deleted from
# the repo; same for the stale frontend/vite.config.mjs (superseded by
# vite.config.js). Excluded so they don't get scored as uncovered new code.
sonar.exclusions=**/*.min.js,**/*.min.css,**/dist/**,**/*.test.ts,**/*.test.tsx,frontend/src/App.jsx,frontend/src/main.jsx,frontend/components/TodoApp.jsx,frontend/vite.config.mjs

# --- Coverage ----------------------------------------------------------
# ci-sast.yml's SonarQube job runs `npm run test:coverage` in backend/ and
# frontend/ before the scan, emitting */coverage/lcov.info (paths relative to
# sonar.projectBaseDir = repo root).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# --- Misc ------------------------------------------------------------
sonar.sourceEncoding=UTF-8

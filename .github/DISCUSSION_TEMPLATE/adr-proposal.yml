body:
  - type: input
    id: date
    attributes:
      label: Date
      description: Date when the ADR was created.
      placeholder: 2026-09-DD
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: Context
      description: What situation requires a decision?
      placeholder: Slowness observed in MySQL; a proposal was made to migrate to PostgreSQL.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: What are our options?
      placeholder: |
        1. Stay with MySQL and optimize
        2. Migrate to PostgreSQL
        3. Migrate to MongoDB
    validations:
      required: true

  - type: dropdown
    id: decision
    attributes:
      label: Decision
      options:
        - Proposed
        - Accepted
        - Rejected
        - Superseded
      default: 0
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Justification
      description: Why was this decision taken?
    validations:
      required: false

  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What are the expected consequences, trade-offs, or risks?
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Add relevant issues, pull requests, documentation, benchmarks, or external resources.
    validations:
      required: false

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/*"
      - ".github/rulesets"
  pull_request:
  workflow_dispatch: # allow a manual re-run from the Actions tab


# Least privilege: this workflow only needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs for the same PR (or branch). Runs on `main` are left
# alone -- we want every push to `main` to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devshell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PODMAN_NO_SOCKET: "1" # don't spawn a Podman API socket in CI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No git writes in this job; do not leave the token in .git/config.
          persist-credentials: false

      # Local composite action: check out first, then it installs Nix.
      # `nix flake check` below already evaluates the flake, so skip the warm.
      - uses: ./.github/actions/setup-devshell
        with:
          warm: "false"

      - name: Check the flake evaluates
        run: nix flake check --no-build

      - name: Enter the dev shell and sanity-check tooling
        run: |
          nix develop --command bash -euo pipefail -c '
            just --list
            podman --version
            podman-compose -f docker-compose.yml config >/dev/null
          '

  # Runs alongside `frontend` (no `needs` between them = parallel scheduling).
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Backend jest coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Start the API and check it responds
        run: |
          npm start &
          trap 'kill $!' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/items > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not respond on :3000 in time" >&2
          exit 1

  # Runs alongside `backend` (no `needs` between them = parallel scheduling).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Serve the build and check it responds
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          trap 'kill $!' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "frontend did not respond on :4173 in time" >&2
          exit 1

  # Runs alongside `backend`/`frontend` (no `needs` between them = parallel
  # scheduling). Tests the `db` service from docker-compose.yml as-is --
  # no app code involved, just the container image + healthcheck + connectivity.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Start the db service and wait for its healthcheck
        run: docker compose up -d --wait db

      - name: Check the database accepts connections
        run: docker compose exec -T db pg_isready -U todo -d todo

      - name: Show db logs on failure
        if: failure()
        run: docker compose logs db

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # Runs alongside backend/frontend/database. Audits THIS branch's lockfiles
  # against the GitHub Advisory Database with `npm audit` -- the same advisory
  # data Dependabot uses, resolved from the pull-request branch's own
  # package-lock.json rather than from `main` (all the Dependabot alerts API can
  # report on). Software-composition analysis, not SAST, so it lives here and
  # not in ci-sast.yml.
  #
  # Gate (both workspaces combined): fails on any Critical or High advisory, or
  # on 5 or more Moderate+Low. Also fails if `npm audit` cannot be completed --
  # an unknown posture is not a passing one. The counts and every advisory land
  # in the job summary, and the raw reports upload as an artifact, pass or fail.
  dependencies-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The PR branch head, not the merge ref -- the audit is purely this
          # branch's dependency tree.
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit each workspace lockfile
        run: |
          set -euo pipefail
          mkdir -p dependency-audit

          # --- collect `npm audit` for each workspace, retrying transient failures ---
          audit_ok=1
          for ws in backend frontend; do
            raw="dependency-audit/${ws}.json"
            for attempt in 1 2 3; do
              # npm audit exits non-zero when it finds advisories -- that is
              # still a valid report, so judge the JSON body, not the status.
              ( cd "$ws" && npm audit --json ) > "$raw" 2>/dev/null || true
              jq -e '.metadata.vulnerabilities' "$raw" > /dev/null 2>&1 && break
              [ "$attempt" -lt 3 ] && sleep 3 || true
            done
            if ! jq -e '.metadata.vulnerabilities' "$raw" > /dev/null 2>&1; then
              audit_ok=0
              echo "::error::npm audit produced no usable report for ${ws}"
              echo '{}' > "$raw"   # keep the file valid JSON for the steps below
            fi
          done

          # --- totals across every workspace that reported ---
          sev() { jq -s --arg k "$1" '[ .[].metadata.vulnerabilities[$k] // 0 ] | add // 0' dependency-audit/*.json; }
          crit=$(sev critical); high=$(sev high); mod=$(sev moderate); low=$(sev low)
          ch=$((crit + high)); ml=$((mod + low))

          {
            echo "### Dependency audit (\`npm audit\`)"
            echo
            echo "_This branch's \`package-lock.json\` files vs the GitHub Advisory Database. \`main\`'s posture lives in **Security → Dependabot**._"
            echo
            echo '| Workspace | Critical | High | Moderate | Low | Total |'
            echo '| --- | --- | --- | --- | --- | --- |'
            for ws in backend frontend; do
              raw="dependency-audit/${ws}.json"
              if jq -e '.metadata.vulnerabilities' "$raw" > /dev/null 2>&1; then
                jq -r --arg ws "$ws" '.metadata.vulnerabilities
                  | "| `\($ws)` | \(.critical) | \(.high) | \(.moderate) | \(.low) | \(.total) |"' "$raw"
              else
                echo "| \`$ws\` | ? | ? | ? | ? | npm audit failed |"
              fi
            done

            echo
            echo "**Gate:** any Critical or High fails; 5 or more Moderate+Low fails. Found **${crit}** Critical, **${high}** High, **${ml}** Moderate+Low."
            echo
            echo '<details><summary>Advisories</summary>'
            echo
            echo '| Workspace | Severity | Package | Direct | Fix | Advisory |'
            echo '| --- | --- | --- | --- | --- | --- |'
            for ws in backend frontend; do
              raw="dependency-audit/${ws}.json"
              [ -f "$raw" ] || continue
              jq -r --arg ws "$ws" '
                (.vulnerabilities // {}) | to_entries[] | .value | . as $v
                | ([$v.via[]? | select(type == "object")]) as $adv
                | ([$v.via[]? | select(type == "string")]) as $chain
                | "| \($ws) | \($v.severity) | `\($v.name)` "
                  + "| \(if $v.isDirect then "yes" else "no" end) "
                  + "| \(if ($v.fixAvailable | type) == "object" then $v.fixAvailable.version
                          elif $v.fixAvailable then "yes" else "no" end) "
                  + "| \(if ($adv | length) > 0
                          then [$adv[] | "[\(.title)](\(.url))"] | join("<br>")
                          else "via " + ($chain | join(", ")) end) |"
              ' "$raw"
            done
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          # --- gate ---
          if [ "$audit_ok" -ne 1 ]; then
            echo "::error::dependency audit incomplete -- an unknown posture cannot clear the gate"
            exit 1
          fi
          rc=0
          if [ "$ch" -gt 0 ]; then
            echo "::error::${crit} critical + ${high} high dependency vulnerabilities found (allowed: 0)"
            echo "::error::Please refer to the workflow summary for details"
            rc=1
          fi
          if [ "$ml" -ge 5 ]; then
            echo "::error::${ml} moderate + low dependency vulnerabilities found (allowed: fewer than 5)"
            echo "::error::Please refer to the workflow summary for details"
            rc=1
          fi
          exit "$rc"

      - name: Upload the raw audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: dependency-audit
          if-no-files-found: warn

  # Single stable check for the branch ruleset to require.
  # Add a job to `needs` here to make it mandatory to the branch ruleset.
  ci-required:
    if: always()
    needs: [devshell, backend, frontend, database, dependencies-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        run: |
          if printf '%s\n' '${{ join(needs.*.result, ' ') }}' | grep -Eqw 'failure|cancelled'; then
            echo "a required job did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
